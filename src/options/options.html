<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>RemoteFrom 设置</title><link rel="stylesheet" href="../ui/pages.css"><main><h1>能否投递 · 设置</h1><p>所在国家只保存在本机，用于匹配职位的地区要求。</p><form id="settings"><label for="home">所在国家（ISO 代码或中英文名称）</label><input id="home" placeholder="CN / 中国 / China 或 GB / UK / 英国" required><button>保存国家</button></form><p id="status" role="status"></p><details><summary>本地许可测试桩</summary><p>每天 3 次免费分析，按本地日期重置。测试许可可本地生成，不涉及购买或真实授权。</p><label for="license">测试许可</label><input id="license"><button id="save-license">保存许可</button><button id="demo">生成并启用测试许可</button><button id="clear">恢复免费版</button></details><details><summary>支持国家与地区映射</summary><p>EU 为 27 个成员国；Europe 为 EU 加英国、挪威、瑞士、乌克兰、塞尔维亚、冰岛；EMEA 为 Europe 加本 MVP 收录的中东和非洲国家。此映射不完整，未收录的国家无法判定。</p><div id="map"></div></details><p><small>“可投递”仅表示文本地区范围匹配，不保证雇主接受申请、签证或工作许可。</small></p></main><script src="../lib/eligibility.js"></script><script src="../lib/license.js"></script><script src="options.js"></script></html>
